
server {
    listen 80 default_server;
    server_name _;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # Keep OAuth state cookies on the same hostname as the Google callback.
    location / {
        return 302 http://localhost:8080$request_uri;
    }
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Callback query strings contain one-time Google authorization codes.
        access_log off;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
