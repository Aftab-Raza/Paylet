name: paylet-production

x-backend-env: &backend-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 5000
  DATABASE_URL: ${DATABASE_URL:?Set the managed PostgreSQL URL}
  SESSION_SECRET: ${SESSION_SECRET:?Set a random production session secret}
  APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
  GOOGLE_REDIRECT_URI: https://${APP_DOMAIN}/api/auth/google/callback
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the production Google OAuth client}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set the production Google OAuth secret}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-}
  TRUST_PROXY: 172.31.42.10

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment: *backend-env
    volumes:
      - ./deploy/certs:/run/db-certs:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [api]
    logging: *logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    networks: [web]
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      api:
        ipv4_address: 172.31.42.10
      web: {}
    logging: *logging

  migrate:
    profiles: [tools]
    build:
      context: ./backend
      target: build
    environment:
      <<: *backend-env
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the separate migration-owner URL}
    volumes:
      - ./deploy/certs:/run/db-certs:ro
    networks: [api]
    entrypoint: [npx, prisma]
    command: [migrate, deploy]
    logging: *logging

  backup:
    profiles: [tools]
    build: ./deploy/backup
    environment:
      PGDATABASE: ${BACKUP_DATABASE_URL:?Set a TLS database URL for pg_dump}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set the off-server backup repository}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set a unique encryption password}
      RESTIC_CACHE_DIR: /tmp/restic-cache
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set backup storage access key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set backup storage secret}
      BACKUP_MONITOR_URL: ${BACKUP_MONITOR_URL:-}
    volumes:
      - ./deploy/certs:/run/db-certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=${BACKUP_TMPFS_SIZE:-512m},mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [api]
    logging: *logging

volumes:
  caddy_data:
  caddy_config:

networks:
  api:
    ipam:
      config:
        - subnet: 172.31.42.0/24
  web: {}
