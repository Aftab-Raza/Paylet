server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    # Production API traffic goes directly from Caddy to the backend.
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
